<!DOCTYPE html>
<html>
<head>
<title>Hotel Booking Form</title>
<style>
body{
    font-family: Arial;
    background:#f2f2f2;
}
.container{
    width:400px;
    margin:30px auto;
    background:white;
    padding:20px;
    border-radius:8px;
    box-shadow:0 0 10px gray;
}
input,select{
    width:100%;
    padding:8px;
    margin:6px 0;
}
button{
    width:100%;
    padding:10px;
    background:green;
    color:white;
    border:none;
    cursor:pointer;
}
button:hover{
    background:darkgreen;
}
.error{
    color:red;
    font-size:13px;
}
.success{
    color:green;
    font-weight:bold;
    text-align:center;
}
</style>
</head>
<body>

<div class="container">
<h2>Hotel Booking Form</h2>

<form id="bookingForm">

<input type="text" id="name" placeholder="Full Name">
<div class="error" id="nameError"></div>

<input type="text" id="email" placeholder="Email Address">
<div class="error" id="emailError"></div>

<input type="text" id="mobile" placeholder="Mobile Number">
<div class="error" id="mobileError"></div>

<label>Check-in Date</label>
<input type="date" id="checkin">
<div class="error" id="checkinError"></div>

<label>Check-out Date</label>
<input type="date" id="checkout">
<div class="error" id="checkoutError"></div>

<input type="number" id="guests" placeholder="Number of Guests">
<div class="error" id="guestsError"></div>

<select id="room">
<option value="Select">Select Room Type</option>
<option value="Single">Single</option>
<option value="Double">Double</option>
<option value="Suite">Suite</option>
</select>
<div class="error" id="roomError"></div>

<button type="submit">Book Now</button>

<div class="success" id="successMsg"></div>

</form>
</div>

<script>
document.getElementById("bookingForm").addEventListener("submit", function(e){

e.preventDefault();
let valid=true;

// Clear previous errors
document.querySelectorAll(".error").forEach(e=>e.innerHTML="");
document.getElementById("successMsg").innerHTML="";

let name=document.getElementById("name").value.trim();
let email=document.getElementById("email").value.trim();
let mobile=document.getElementById("mobile").value.trim();
let checkin=document.getElementById("checkin").value;
let checkout=document.getElementById("checkout").value;
let guests=document.getElementById("guests").value;
let room=document.getElementById("room").value;

// Name validation
if(name=="" || !/^[A-Za-z ]+$/.test(name)){
document.getElementById("nameError").innerHTML="Enter valid name (alphabets only)";
valid=false;
}

// Email validation
if(!/^\S+@\S+\.\S+$/.test(email)){
document.getElementById("emailError").innerHTML="Enter valid email";
valid=false;
}

// Mobile validation
if(!/^\d{10}$/.test(mobile)){
document.getElementById("mobileError").innerHTML="Enter 10 digit mobile number";
valid=false;
}

// Check-in validation
let today=new Date().toISOString().split("T")[0];
if(checkin<today){
document.getElementById("checkinError").innerHTML="Check-in cannot be past date";
valid=false;
}

// Check-out validation
if(checkout<=checkin){
document.getElementById("checkoutError").innerHTML="Check-out must be after check-in";
valid=false;
}

// Guests validation
if(guests<=0 || guests>6){
document.getElementById("guestsError").innerHTML="Guests must be between 1 and 6";
valid=false;
}

// Room validation
if(room=="Select"){
document.getElementById("roomError").innerHTML="Select a room type";
valid=false;
}

// Final success
if(valid){
document.getElementById("successMsg").innerHTML="Booking Successful";
}

});
</script>

</body>
</html>
